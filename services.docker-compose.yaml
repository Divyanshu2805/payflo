services:
  postgres:
    image: postgres:18-alpine
    container_name: pgvector-payflo
    # Group commit: a committing transaction waits up to 1 ms for others so they share one WAL flush.
    # Durable (unlike synchronous_commit=off); measured ~+6% throughput under the load test.
    # Memory and WAL: the defaults (128 MB of cache, a checkpoint every 1 GB of WAL) are far too small
    # for write-heavy load; fsync and synchronous_commit stay on.
    command: [ "postgres",
               "-c", "commit_delay=1000", "-c", "commit_siblings=5",
               "-c", "shared_buffers=2GB", "-c", "effective_cache_size=6GB", "-c", "wal_buffers=64MB",
               "-c", "max_wal_size=8GB", "-c", "checkpoint_timeout=15min",
               "-c", "checkpoint_completion_target=0.9", "-c", "wal_compression=lz4" ]
    shm_size: 1gb
    environment:
      POSTGRES_DB: payflo-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d payflo-db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    # Set REDIS_PASSWORD (in your shell or a .env file) to require a password; the services read the same
    # variable. Unset, there is none. ($$ is compose's escape: the shell inside the container expands it.)
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: [ "sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: docker.io/confluentinc/confluent-local:7.5.0
    container_name: kafka-razorpay-me
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: '6PMpHYL9QkeyXRj9Nrp4KA'
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.5.0
    container_name: control-center-me
    depends_on:
      - kafka
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'kafka:9092'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_INTERNAL_TOPICS_REPLICATION_FACTOR: 1
      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION_FACTOR: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_STREAMS_NUM_STREAM_THREADS: 2
      CONTROL_CENTER_CONNECT_CLUSTER: http://kafka:8091
      CONTROL_CENTER_KAFKA_CLUSTER_ID: '6PMpHYL9QkeyXRj9Nrp4KA'
      CONTROL_CENTER_UI_LABEL: Razorpay Clone Kafka
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data: