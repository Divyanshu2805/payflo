server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/v1/auth/**,/v1/merchants/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/v1/orders/**,/v1/payments/**
            - id: vault-service
              uri: lb://vault-service
              predicates:
                - Path=/v1/vault/**
            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/webhook/**

