server:
  port: 8080
  # TLS for the public listener, off by default. To turn it on, point it at a PKCS12 keystore and set
  # GATEWAY_TLS_ENABLED=true. In production TLS is more often terminated by a load balancer or Ingress in
  # front of the gateway, in which case leave this off. The hop from the gateway to the services is plain
  # HTTP either way (see docs/architecture/security-model.md).
  ssl:
    enabled: ${GATEWAY_TLS_ENABLED:false}
    key-store: ${GATEWAY_TLS_KEYSTORE:}
    key-store-password: ${GATEWAY_TLS_KEYSTORE_PASSWORD:}
    key-store-type: ${GATEWAY_TLS_KEYSTORE_TYPE:PKCS12}

# Actuator (health, prometheus) on its own port, outside GatewayAuthFilter and the public
# listener: Prometheus can scrape it, but it isn't reachable through the gateway's public port.
management:
  server:
    port: ${MANAGEMENT_PORT:9081}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/v1/auth/**,/v1/merchants/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/v1/orders/**,/v1/payments/**
            - id: vault-service
              uri: lb://vault-service
              predicates:
                - Path=/v1/vault/**
            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/webhook/**

app:
  security:
    # The gateway sets identity headers itself; never trust client-supplied ones.
    trust-inbound-headers: false
    public-routes:
      - /v1/auth/signup
      - /v1/auth/login
      - /webhook/**
    # Set to the header your proxy / load balancer fills with the real client address (e.g. X-Forwarded-For)
    # so the per-address limits below see clients, not the proxy. Leave empty when clients connect directly.
    client-ip-header: ${CLIENT_IP_HEADER:}
    # Signup and login, per client address per minute. Raise it (PUBLIC_AUTH_RATE_LIMIT_PER_MINUTE) when
    # provisioning many merchants from one machine, as the load test does.
    public-auth-requests-per-minute: ${PUBLIC_AUTH_RATE_LIMIT_PER_MINUTE:120}
    # Failed authentications per client address per minute before further attempts are refused.
    max-failed-auth-per-minute: ${MAX_FAILED_AUTH_PER_MINUTE:30}
  rate-limit:
    method: fixed
    use-case:
      api-key:
        # Per API key. Raise it (API_KEY_RATE_LIMIT_PER_MINUTE) for load tests, or every key tops out at 200/min.
        requests-per-minute: ${API_KEY_RATE_LIMIT_PER_MINUTE:200}
      jwt:
        # Per merchant, for dashboard (JWT) traffic.
        requests-per-minute: ${JWT_RATE_LIMIT_PER_MINUTE:600}
