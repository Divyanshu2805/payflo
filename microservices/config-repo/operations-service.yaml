server:
  port: 8084

spring:
  datasource:
    url: ${OPERATIONS_DB_URL:jdbc:postgresql://localhost:5432/payflo_operations}
    username: ${DB_USER:user}
    password: ${DB_PASS:password}
    hikari:
      # Sized from load testing (docs/load-testing/). Keep the sum across services under Postgres
      # max_connections. Fail fast when the pool is exhausted instead of queueing for 30s.
      maximum-pool-size: ${OPERATIONS_DB_POOL_SIZE:16}
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it,
      # so a missing or mistyped column fails at start-up instead of at the first request.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Group INSERT/UPDATEs into JDBC batches.
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true
  task:
    scheduling:
      # One thread per scheduled job, so no job waits behind another (see SchedulingConfig). Raise it when a
      # service gains scheduled jobs.
      pool:
        size: 8
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    # Carry trace context through Kafka headers (producer -> consumer spans in Zipkin).
    template:
      observation-enabled: true
    listener:
      ack-mode: manual
      # WebhookKafkaConsumer takes whole polls: one transaction and one Redis call for up to max-poll-records events.
      type: batch
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: operations-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.project.payflo.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

app:
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refunds.events
      settlement: settlements.events
      payments: payments.events
      orders: orders.events
      refunds: refunds.events
      settlements: settlements.events
  webhook:
    # How long the consumer remembers a merchant's webhook targets before asking merchant-service again.
    target-cache-ttl-seconds: 30
    delivery:
      redis-key: webhook-retry
      # A batch is up to poll-batch-size events taken off the queue together: claimed in one transaction, delivered
      # concurrently, and recorded in one UPDATE. concurrency batches run at once; each needs a database connection
      # only for those two short moments (never during the HTTP calls), so keep it well under the pool size.
      poll-batch-size: 100
      concurrency: 4
      # HTTP calls to merchants in flight at once across all batches (a batch is not sent as a burst of its whole size).
      http-concurrency: 32

webhook:
  delivery:
    signature-header: X-PayFlo-Signature

settlement:
  # The platform fee, as a share of what the merchant kept after refunds, and the GST charged on that fee.
  fee-rate: ${SETTLEMENT_FEE_RATE:0.02}
  gst-rate: ${SETTLEMENT_GST_RATE:0.18}
  # T+N: a payment is paid out only once it was captured this many days ago. 0 pays out everything captured.
  hold-days: ${SETTLEMENT_HOLD_DAYS:0}
  # Merchants settled at once (each holds database connections), and the most payments paid to one merchant per run.
  concurrency: 4
  max-payments-per-run: 20000
  page-size: 1000
  # A transfer the bank accepted but never answered is failed after this long, so its payments are paid out again.
  transfer-timeout-minutes: 120
  # The simulated bank. chaos-mode: NORMAL (answers after a delay, success-rate % succeed), SLOW (delays doubled),
  # SUCCESS, FAILURE (every transfer declined), TIMEOUT (never answers). refuse-rate: % of transfers refused outright.
  # Like the payment simulator, each answer is derived from the settlement id, so a settlement always gets the same one.
  simulator:
    chaos-mode: NORMAL
    min-delay-seconds: 2
    max-delay-seconds: 12
    success-rate: 95
    refuse-rate: 0

resilience4j:
  circuitbreaker:
    configs:
      default:
        # ~100 calls is still well under a second of traffic at a few hundred req/s;
        # 20 made the breaker trip on momentary tail spikes.
        sliding-window-size: 100
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        # Count only failures of the remote call. The annotations sit on whole service methods, so
        # without this a local DB-pool timeout in payment-service would open the breaker for a
        # healthy merchant-service (seen under load testing).
        # 4xx answers from a healthy dependency don't count.
        record-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      merchant-service:
        base-config: default
      payment-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        # Retry only connection-level failures; retrying a whole service method on e.g. a DB timeout
        # multiplies load exactly when the system is already saturated.
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
    instances:
      merchant-service:
        base-config: default
      payment-service:
        base-config: default
