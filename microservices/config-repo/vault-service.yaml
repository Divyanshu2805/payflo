server:
  port: 8083

spring:
  datasource:
    url: ${VAULT_DB_URL:jdbc:postgresql://localhost:5432/payflo_vault}
    username: ${DB_USER:user}
    password: ${DB_PASS:password}
    hikari:
      # Sized from load testing (docs/load-testing/). Keep the sum across services under Postgres
      # max_connections. Fail fast when the pool is exhausted instead of queueing for 30s.
      maximum-pool-size: ${VAULT_DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  master-key: ${VAULT_MASTER_KEY:arXfSlAXS4TRCw5tlKCFSwjG+D4C4ESUV47We3pw2eI=}

resilience4j:
  thread-pool-bulkhead:
    instances:
      vault-card-processor:
        core-thread-pool-size: 10
        max-thread-pool-size: 20
        queue-capacity: 50
