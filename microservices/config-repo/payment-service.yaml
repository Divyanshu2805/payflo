server:
  port: 8082

spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payflo_payment}
    username: ${DB_USER:user}
    password: ${DB_PASS:password}
    hikari:
      # Sized from load testing (docs/load-testing/). Keep the sum across services under Postgres
      # max_connections. Fail fast when the pool is exhausted instead of queueing for 30s.
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:40}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Group INSERT/UPDATEs into JDBC batches.
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true
  task:
    scheduling:
      # One thread per scheduled job, so no job waits behind another (see SchedulingConfig). Raise it when a
      # service gains scheduled jobs.
      pool:
        size: 4
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    # Carry trace context through Kafka headers (producer -> consumer spans in Zipkin).
    template:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refunds.events
      settlement: settlements.events

payment:
  order:
    default-order-expiry-minutes: 30
  simulator:
    poll-interval-ms: 5000
    # Callbacks resolved at once; each holds a database connection, so keep it well under the pool size.
    concurrency: 16
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NETBANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80

resilience4j:
  circuitbreaker:
    configs:
      default:
        # ~100 calls is still well under a second of traffic at a few hundred req/s;
        # 20 made the breaker trip on momentary tail spikes.
        sliding-window-size: 100
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # Count only failures of the remote call. The annotations sit on whole service methods, so
        # without this a local DB-pool timeout in payment-service would open the breaker for a
        # healthy merchant-service (seen under load testing).
        # 4xx answers from a healthy dependency don't count.
        record-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      merchant-service:
        base-config: default
      vault-service:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Retry only connection-level failures; retrying a whole service method on e.g. a DB timeout
        # multiplies load exactly when the system is already saturated.
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
    instances:
      merchant-service:
        base-config: default
      vault-service:
        base-config: default
