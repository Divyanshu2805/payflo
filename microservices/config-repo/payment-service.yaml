server:
  port: 8082

spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payflo_payment}
    username: ${DB_USER:user}
    password: ${DB_PASS:password}
    hikari:
      # Sized from load testing (docs/load-testing/). Keep the sum across services under Postgres
      # max_connections. Fail fast when the pool is exhausted instead of queueing for 30s.
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:40}
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it,
      # so a missing or mistyped column fails at start-up instead of at the first request.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Group INSERT/UPDATEs into JDBC batches.
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true
  task:
    scheduling:
      # One thread per scheduled job, so no job waits behind another (see SchedulingConfig). Raise it when a
      # service gains scheduled jobs.
      pool:
        size: 8
  cloud:
    openfeign:
      client:
        config:
          vault-service:
            # vault-service gives its own card processor 5 seconds; wait a little longer than that, so a slow
            # charge is reported by vault-service rather than cut off here with an unknown outcome.
            read-timeout: 8000
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    # Carry trace context through Kafka headers (producer -> consumer spans in Zipkin).
    template:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refunds.events
      settlement: settlements.events

payment:
  order:
    default-order-expiry-minutes: 15
  refund:
    # RefundResolver stands in for the bank's answer to a refund: it answers refunds older than this, approving
    # this share of them (chosen from each refund's id, so a given refund always gets the same answer).
    delay-seconds: 3
    success-rate: 95
    poll-interval-ms: 5000
  # Card-testing protection (CardVelocityGuard): someone with a merchant's API key running stolen card numbers through
  # it fails most of them. Once min-failures card payments have failed in the window and they are at least failure-ratio of
  # that merchant's card payments, its card payments are refused (429 CARD_TESTING_SUSPECTED) until the window ends.
  # An honest merchant's declines are a small share (the simulated bank declines about 1 in 10). One order also takes at
  # most max-attempts-per-order card payments (400 ORDER_CARD_ATTEMPTS_EXCEEDED).
  velocity:
    card:
      enabled: ${CARD_VELOCITY_ENABLED:true}
      window-minutes: 10
      min-failures: 20
      failure-ratio: 0.5
      max-attempts-per-order: 5
  timeout:
    # PaymentTimeoutSweeper: a payment the bank hasn't answered for this long is failed (the simulator
    # answers in seconds; chaos-mode TIMEOUT never does) ...
    authorizing-minutes: 15
    # ... one that stays authorized without being captured lapses ...
    authorized-minutes: 60
    # ... and an unpaid order past its expires_at is expired, looking back only this far.
    order-expiry-lookback-days: 7
    sweep-interval-ms: 60000
  simulator:
    # How often the bank's answers are looked for (a delay between runs). The answer itself is due 1-10 seconds
    # after the payment, by method; this only bounds how long past that the payment waits.
    poll-interval-ms: 1000
    # Payments resolved per transaction (one lock query, batched writes, one commit), and how many of those
    # batches run at once. Each batch holds a database connection, so keep concurrency well under the pool size.
    batch-size: 50
    concurrency: 4
    chaos-mode: NORMAL
    # The acquirer refusing a capture (CaptureSimulator). The test values (docs/api/mock-acquirer.md) always do;
    # failure-rate also refuses this percent of payments, chosen from each payment's id. A refused capture leaves the
    # payment AUTHORIZED, and it is refused failures-before-success times before one goes through.
    capture:
      failure-rate: 0
      failures-before-success: 1
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NETBANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80
      WALLET:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95

resilience4j:
  circuitbreaker:
    configs:
      default:
        # ~100 calls is still well under a second of traffic at a few hundred req/s;
        # 20 made the breaker trip on momentary tail spikes.
        sliding-window-size: 100
        minimum-number-of-calls: 50
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # Count only failures of the remote call. The annotations sit on whole service methods, so
        # without this a local DB-pool timeout in payment-service would open the breaker for a
        # healthy merchant-service (seen under load testing).
        # 4xx answers from a healthy dependency don't count.
        record-exceptions:
          - feign.RetryableException
          - feign.FeignException$FeignServerException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      merchant-service:
        base-config: default
      vault-service:
        base-config: default
  # Only merchant-service lookups are retried (find-or-create is safe to repeat). A card charge is not:
  # a timed-out charge may have succeeded, and repeating it could charge twice.
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Retry only connection-level failures; retrying a whole service method on e.g. a DB timeout
        # multiplies load exactly when the system is already saturated.
        retry-exceptions:
          - feign.RetryableException
          - java.io.IOException
    instances:
      merchant-service:
        base-config: default
