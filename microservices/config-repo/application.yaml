# Shared by every service that imports config from config-service.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            # Feign's own defaults are 10s to connect and 60s to read: one hung service would hold a request
            # thread for a minute per call. Slower calls are set per client (vault-service in payment-service.yaml).
            connect-timeout: 2000
            read-timeout: 5000
  jpa:
    # Open-Session-In-View holds a DB connection for the whole HTTP request once the first query
    # runs — including across remote Feign calls (payment -> vault, order -> merchant). Under load
    # that exhausted payment-service's pool. Connections are now held only inside transactions.
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  threads:
    virtual:
      enabled: true

internal:
  # Shared by every service: required on /internal/** requests, sent by every Feign client. Development
  # default; set INTERNAL_API_TOKEN to a long random value in any shared environment.
  api-token: ${INTERNAL_API_TOKEN:dev-internal-api-token-change-me}

app:
  security:
    # true makes a service refuse to start while it is using a committed development secret (JWT key,
    # vault master key, webhook encryption key, internal token). Set ENFORCE_STRONG_SECRETS=true in any
    # shared environment; false (the default) only logs a warning.
    enforce-strong-secrets: ${ENFORCE_STRONG_SECRETS:false}
  outbox:
    # Published events are deleted after this long; failed ones go back in the queue after a pause.
    retention-days: ${OUTBOX_RETENTION_DAYS:7}
    requeue-failed-after-minutes: 5

webhook:
  # Development default: lets a merchant's webhook point at localhost / a private address and use plain
  # http (the documented local test uses http://localhost:8080/webhook/success). Link-local and metadata
  # addresses are blocked regardless. Set WEBHOOK_ALLOW_PRIVATE_TARGETS=false in any shared environment,
  # or merchants can make operations-service call your internal services.
  allow-private-targets: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:true}

jwt:
  secret-key: ${JWT_SECRET:dont-use-in-prod-a9asd7fulasjdfaklsdfu98q3uhjdiosh897as9d8f7ua9osufdjilasdjf}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # 1.0 = trace every request. Drop it (e.g. 0.05) for load tests so Zipkin isn't the bottleneck.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets let Prometheus compute p50/p95/p99 across instances
      # (histogram_quantile), and the SLO bucket at 1s gives "share of requests under the p99 target".
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s
