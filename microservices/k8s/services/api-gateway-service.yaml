# api-gateway-service: Single public entry point; exposed on NodePort 30080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  namespace: payflo
  labels:
    app: api-gateway-service
spec:
  # One replica by default; `kubectl apply -k microservices/k8s-scaled` runs three (see docs/deployment/scaling.md).
  # The gateway keeps no state of its own (keys, rate limits and revocations are in Redis), so replicas are interchangeable.
  replicas: 1
  # A rollout starts the new pod and waits for it to be ready before stopping an old one, so none is ever missing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      # Time to finish in-flight requests (server.shutdown is graceful, 20 s) after the endpoint has been removed.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api-gateway-service
          image: payflo/api-gateway-service:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                # Lets the Service stop sending new requests to this pod before it starts shutting down.
                command: ["sleep", "5"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9081
              name: management
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # Optional: unset means no Redis password / the development internal token. Set both in secrets.env
            # for anything shared (see secrets.env.example).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INTERNAL_API_TOKEN
                  optional: true
            # The platform operator's key for /v1/admin/**: only the gateway checks it.
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ADMIN_API_KEY
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9081
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9081
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: payflo
spec:
  type: NodePort
  selector:
    app: api-gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Actuator (health, prometheus) lives on the management port, outside the public NodePort, so
# only in-cluster clients like Prometheus can reach it.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-management
  namespace: payflo
spec:
  type: ClusterIP
  selector:
    app: api-gateway-service
  ports:
    - port: 9081
      targetPort: 9081
