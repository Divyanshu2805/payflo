# vault-service: PCI-scoped card vault; the only pod holding VAULT_MASTER_KEY.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-service
  namespace: payflo
  labels:
    app: vault-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-service
  template:
    metadata:
      labels:
        app: vault-service
    spec:
      containers:
        - name: vault-service
          image: payflo/vault-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: VAULT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: VAULT_DB_PASSWORD
            - name: VAULT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: VAULT_MASTER_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: payflo
spec:
  type: ClusterIP
  selector:
    app: vault-service
  ports:
    - port: 80
      targetPort: 8083
