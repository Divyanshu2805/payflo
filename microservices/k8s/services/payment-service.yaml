# payment-service: Orders, payments, payment saga, outbox, bank callback simulator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payflo
  labels:
    app: payment-service
spec:
  # One replica by default; `kubectl apply -k microservices/k8s-scaled` runs three (see docs/deployment/scaling.md).
  # Every @Scheduled job is ShedLock-guarded and state changes are row-locked, so replicas can run side by side.
  replicas: 1
  # A rollout starts the new pod and waits for it to be ready before stopping an old one, so none is ever missing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      # Time to finish in-flight requests (server.shutdown is graceful, 20 s) after the endpoint has been removed.
      terminationGracePeriodSeconds: 40
      containers:
        - name: payment-service
          image: payflo/payment-service:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                # Lets the Service stop sending new requests to this pod before it starts shutting down.
                command: ["sleep", "5"]
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # Optional: unset means no Redis password / the development internal token. Set both in secrets.env
            # for anything shared (see secrets.env.example).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: INTERNAL_API_TOKEN
                  optional: true
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYMENT_DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payflo
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8082
