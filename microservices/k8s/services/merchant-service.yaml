# merchant-service: Merchants, auth, API keys, customers, webhook configs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: payflo
  labels:
    app: merchant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
    spec:
      containers:
        - name: merchant-service
          image: payflo/merchant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: MERCHANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MERCHANT_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: WEBHOOK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: WEBHOOK_SECRET_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: payflo
spec:
  type: ClusterIP
  selector:
    app: merchant-service
  ports:
    - port: 80
      targetPort: 8081
