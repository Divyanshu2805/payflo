# operations-service: Webhook delivery and nightly settlement.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-service
  namespace: payflo
  labels:
    app: operations-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operations-service
  template:
    metadata:
      labels:
        app: operations-service
    spec:
      containers:
        - name: operations-service
          image: payflo/operations-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: OPERATIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPERATIONS_DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: operations-service
  namespace: payflo
spec:
  type: ClusterIP
  selector:
    app: operations-service
  ports:
    - port: 80
      targetPort: 8084
