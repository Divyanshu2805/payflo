# Local single-node cluster: `kind create cluster --config k8s/kind-config.yaml`.
# The gateway's NodePort (30080) is published on the host as localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: payflo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
