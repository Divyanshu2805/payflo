apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: payflo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: payflo-local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.payflo.svc.cluster.local:9092
            # A login form: the Kafka UI shows every event payload, so it is not left open.
            - name: AUTH_TYPE
              value: LOGIN_FORM
            - name: SPRING_SECURITY_USER_NAME
              value: admin
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KAFKA_UI_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: payflo
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8090
      targetPort: 8080
