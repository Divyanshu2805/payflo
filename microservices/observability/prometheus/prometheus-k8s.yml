# In-cluster scrape config: Kubernetes Service names instead of host.docker.internal.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: payflo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway-management:9081"]
        labels: { service: api-gateway-service }
      - targets: ["merchant-service:80"]
        labels: { service: merchant-service }
      - targets: ["payment-service:80"]
        labels: { service: payment-service }
      - targets: ["vault-service:80"]
        labels: { service: vault-service }
      - targets: ["operations-service:80"]
        labels: { service: operations-service }
