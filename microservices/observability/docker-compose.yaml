# Local observability stack for the microservices running on the host (see docs/observability/).
#   Zipkin      http://localhost:9411   traces
#   Prometheus  http://localhost:9090   metrics (scrapes the services via host.docker.internal)
#   Grafana     http://localhost:3000   dashboards (anonymous viewer; admin/admin to edit)
services:
  zipkin:
    image: openzipkin/zipkin:3.5
    container_name: payflo-zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: payflo-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: payflo-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payflo-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - zipkin
