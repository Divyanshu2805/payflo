spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:../config-repo}

server.port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Kubernetes: config-repo is baked into the image at /config-repo (Jib extraDirectories), and
# Kubernetes Services replace Eureka for discovery.
spring:
  config:
    activate:
      on-profile: k8s
  cloud:
    discovery:
      enabled: false
    config:
      server:
        native:
          search-locations: file:/config-repo

eureka:
  client:
    enabled: false
