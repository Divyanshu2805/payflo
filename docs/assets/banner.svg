<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="PayFlo - The backend behind a Pay now button.">
  <defs>
    <linearGradient id="tile" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7067ff"/>
      <stop offset="0.55" stop-color="#3b4ce8"/>
      <stop offset="1" stop-color="#2733c2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a93ff"/>
      <stop offset="1" stop-color="#5468ff"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2bdff"/>
      <stop offset="1" stop-color="#8190ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0" r="0.75">
      <stop offset="0" stop-color="#7067ff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#3b4ce8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e8ecff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="card">
      <rect width="1000" height="300" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0b1020"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="21.5" fill="none" stroke="#e8ecff" stroke-opacity="0.08"/>

  <rect x="98" y="96" width="124" height="124" rx="34" fill="#5b5cff" fill-opacity="0.45" filter="url(#halo)"/>
  <g transform="translate(88 78) scale(4.5)">
    <rect width="32" height="32" rx="9" fill="url(#tile)"/>
    <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="url(#sheen)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.4"/>
    <g transform="translate(3.6 0) skewX(-12)">
      <rect x="7.5" y="9" width="12.5" height="5.5" rx="2.75" fill="#ffffff"/>
      <rect x="13.5" y="17.5" width="12.5" height="5.5" rx="2.75" fill="#c3c8ff"/>
    </g>
  </g>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="264" y="150" font-size="76" font-weight="700" letter-spacing="-1.5">
      <tspan fill="#f1f3ff">Pay</tspan><tspan fill="url(#word)">Flo</tspan>
    </text>
    <text x="266" y="196" font-size="26" font-weight="600" fill="url(#tag)">The backend behind a “Pay now” button.</text>
  </g>
  <text x="267" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8e97b8" letter-spacing="0.3">orders · payments · card vault · webhooks · settlement · audit</text>
</svg>
