spring:
  application:
    name: payflo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:1000/payflo-db}
    username: ${DB_USER:user}
    password: ${DB_PASS:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
vault:
  encryption:
    master-key: ${VAULT_MASTER_KEY:arXfSlAXS4TRCw5tlKCFSwjG+D4C4ESUV47We3pw2eI=}
payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NETBANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80
      WALLET:
        min-delay-seconds: 1
        max-delay-seconds: 2
        success-rate: 92
jwt:
  secret-key: dont-use-in-prod-a9asd7fulasjdfaklsdfu98q3uhjdiosh897as9d8f7ua9osufdjilasdjf
  refresh-token-expiry-days: 7
