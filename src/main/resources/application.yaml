spring:
  application:
    name: payflo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflo-db}
    username: ${DB_USER:user}
    password: ${DB_PASS:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: payflo-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.project.payflo.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

threads:
  virtual:
    enabled: true

vault:
  master-key: ${VAULT_MASTER_KEY:arXfSlAXS4TRCw5tlKCFSwjG+D4C4ESUV47We3pw2eI=}
payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NETBANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80
      WALLET:
        min-delay-seconds: 1
        max-delay-seconds: 2
        success-rate: 92

jwt:
  secret-key: dont-use-in-prod-a9asd7fulasjdfaklsdfu98q3uhjdiosh897as9d8f7ua9osufdjilasdjf
  refresh-token-expiry-days: 7

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 200
  kafka:
    topics:
      payment: payments.events
      order: orders.events
      refund: refund.events
      settlement: settlement.events
  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100